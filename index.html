<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a73e8">
<title>Roommate Expenses</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #f4f6f8; }
iframe { width: 100%; height: 100%; border: none; display: block; }
</style>
<script>
// Automatically generates a real 512x512 PNG icon for Chrome's Install check
(function() {
const canvas = document.createElement('canvas');
canvas.width = 512;
canvas.height = 512;
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#1a73e8';
ctx.fillRect(0, 0, 512, 512);
ctx.fillStyle = '#ffffff';
ctx.font = 'bold 280px sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('₹', 256, 275);
const pngUrl = canvas.toDataURL('image/png');

const manifest = {
id: '/roommate-expenses/',
name: 'Roommate Expense Tracker',
short_name: 'Expenses',
start_url: location.href,
scope: '/roommate-expenses/',
display: 'standalone',
background_color: '#f4f6f8',
theme_color: '#1a73e8',
icons: [
{ src: pngUrl, sizes: '192x192', type: 'image/png', purpose: 'any' },
{ src: pngUrl, sizes: '512x512', type: 'image/png', purpose: 'any' }
 ]
};
const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
const link = document.createElement('link');
link.rel = 'manifest';
link.href = URL.createObjectURL(blob);
document.head.appendChild(link);
})();
</script>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbxAyRJa4qHrjq4-Q8oRUKw6z_ebzvvf77ynoxHQ_R3DjlZ_fJ0YVfSw3L7wG9_JijXO/exec" allow="clipboard-read; clipboard-write"></iframe>

<script>
if ('serviceWorker' in navigator) {
window.addEventListener('load', () => {
navigator.serviceWorker.register('./sw.js');
});
}
</script>
</body>
</html>
